; Polybar config - hell (light) variant

include-file = ~/.config/polybar/colors/colors-hell.ini

[bar/top]
radius=10.0
;The first 2 characters stands for the amount of transparency.
;background = #11212223
background = #11000000

; Put the bar at the top of the screen
bottom = false
;height=26

;modules-left =  hdd filesystem
modules-center =   title
;modules-right = network-ip
;font-0 = RobotoMono Nerd Font:size=10;2
font-0 = "JetBrainsMono Nerd Font:size=12;2"
font-1 = Noto Sans Mono:style=Regular:size=16;2
font-2 = "Symbols Nerd Font:size=18;3"
;Symbols Nerd Font contains only the Powerline and Nerd Font icons.
;size=16 ensures they match the height of your other fonts.
;T2 tells Polybar to use font-2 for these modules.
override-redirect = true
enable-ipc = true


[bar/mybar]

;foreground = ${colors.darkergreen}
foreground = ${colors.black}
;background = #11212223
background = ${colors.white_t}

; Put the bar at the bottom of the screen
bottom = true
;height=36

modules-left = temp-colored network-ip fsadmin fsroot memory cpu
modules-center = i3
;modules-right = dexcom fsadmin  fsroot memory weather date clock  pavol tray
modules-right = weather date clock  pavol tray

;font-0 = DejaVuSansMono Bold Oblique Nerd Font:size=11;0
font-0 = "Ubuntu Mono Bold Nerd Font:size=10;3"
font-1 = "Symbols Nerd Font:size=10;3"
font-2 = Noto Sans Mono:style=Regular

; --- Shared modules ---

include-file = ~/.config/polybar/modules/dexcom.ini
include-file = ~/.config/polybar/modules/weather.ini
include-file = ~/.config/polybar/modules/tray.ini
include-file = ~/.config/polybar/modules/memory.ini
include-file = ~/.config/polybar/modules/pavol.ini
include-file = ~/.config/polybar/modules/pulseaudio.ini
include-file = ~/.config/polybar/modules/title.ini
include-file = ~/.config/polybar/modules/clock.ini
include-file = ~/.config/polybar/modules/date.ini
include-file = ~/.config/polybar/modules/sep.ini
include-file = ~/.config/polybar/modules/hdd.ini
include-file = ~/.config/polybar/modules/fsroot.ini
include-file = ~/.config/polybar/modules/fsadmin.ini
include-file = ~/.config/polybar/modules/filesystem.ini
include-file = ~/.config/polybar/modules/cpu-temp.ini
include-file = ~/.config/polybar/modules/temp-colored.ini
include-file = ~/.config/polybar/modules/temperature.ini
include-file = ~/.config/polybar/modules/lan.ini
include-file = ~/.config/polybar/modules/cpu.ini
include-file = ~/.config/polybar/modules/wlan.ini

; --- Hell-specific module overrides ---

[module/network-ip]
type = custom/script
exec = ~/.config/polybar/scripts/network-ip.sh
interval = 3600

format = <label>
label = "%output%"

format-padding = 2
format-background = ${colors.white_t}

;format-margin = 5
;format-foreground = ${colors.white}

[module/i3]
type = internal/i3
pin-workspaces = false
strip-wsnumbers = false
index-sort = true
enable-click = true
fuzzy-match = true
format-padding = 1
format-font = 2

;ws-icon-0 = 1;
ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;󰖣
ws-icon-6 = 7;
ws-icon-7 = 8;

;ws-icon-default =

label-mode-padding = 2
label-mode-foreground = #000
label-mode-background = ${colors.primary}


label-focused = %icon%
;label-focused-background = ${colors.darkgrey}
label-focused-foreground = ${colors.white}
;#label-focused-underline= ${colors.primary}
;label-focused-padding = 1
;label-focused-background = ${colors.background-alt}
;label-focused-background = ${colors.darkred}
label-focused-background = ${colors.darkgrey_t}
label-focused-underline= ${colors.primary}
label-focused-padding = 2

; unfocused = Inactive workspace on any monitor
label-unfocused = %icon%
label-unfocused-foreground = ${colors.grey}
label-unfocused-padding = 2

; visible = Active workspace on unfocused monitor
label-visible = %icon%
label-visible-background = ${self.label-focused-background}
label-visible-underline = ${self.label-focused-underline}
label-visible-padding = ${self.label-focused-padding}

; urgent = Workspace with urgency hint set
label-urgent = %icon%
label-urgent-foreground = ${colors.white}
label-urgent-background = ${colors.alert}
;label-urgent-background = ${colors.red}
label-urgent-padding = 1
