[module/cpu-temp]
type = custom/script
exec = ~/.config/polybar/scripts/cpu-temp.sh
label = %output%
;format = <ramp-temp> <label>

;ramp-temp = "  "
;ramp-temp-foreground = ${colors.darkgrey} 
;ramp-temp-0-background = ${colors.darkergreen}
;ramp-temp-1-background = ${colors.darkorange}
;ramp-temp-2-background = ${colors.darkred}

format-prefix = "  "
format-prefix-foreground = ${colors.grey}
format-prefix-background = ${colors.darkred}
format-prefix-spacing = 2
format-prefix-margin = 2
interval = 1
