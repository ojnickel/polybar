[module/network-ip]
type = custom/script
exec = ~/.config/polybar/scripts/network-ip.sh
interval = 3600

format = <label>
label = "%output%"

format-padding = 0
;format-background = ${colors.white_t}

;format-margin = 5
;format-background = ${colors.darkgreen_t}
;format-foreground = ${colors.white}
